<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TPCA PCB READY GO! 展場互動遊戲</title>
<style>

:root{--bg:#fff9ef;--card:#ffffff;--text:#17324b;--muted:#688095;--accent:#ff3a8a;--accent2:#15a7ff;--accent3:#ffd233;--good:#1ab86a;--bad:#f45b5b;--border:#dbe5ef;--shadow:0 14px 40px rgba(18,59,86,.14)}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;background:radial-gradient(circle at top,#fffef7,#f4fbff 70%);color:var(--text)}
.wrap{max-width:980px;margin:0 auto;padding:12px 14px 30px} .card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:22px;box-shadow:var(--shadow)}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;justify-content:center} .badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:900;background:#fff}
.center{text-align:center} .cover{width:100%;max-width:720px;border-radius:22px;border:1px solid var(--border);box-shadow:0 16px 40px rgba(255,58,138,.24);margin:0 auto;display:block}
h1{font-size:clamp(28px,5.2vw,48px);line-height:1.08;letter-spacing:-.04em;margin:14px 0 6px;font-weight:950} h2{font-size:clamp(19px,3vw,26px);margin:6px 0 0;font-weight:900} p{line-height:1.55;margin:8px 0}
.muted{color:var(--muted)} .input{width:100%;padding:13px 15px;border:1px solid var(--border);border-radius:15px;font-size:16px;background:#fff} .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cta,.btn{border:0;border-radius:16px;min-height:52px;padding:14px 22px;font-size:16px;font-weight:950;cursor:pointer} .cta{color:#fff;background:linear-gradient(135deg,var(--accent),#ff7b2f 48%,var(--accent3));box-shadow:0 12px 24px rgba(255,58,138,.22)} .btn{background:#fff;border:1px solid var(--border);color:var(--text)}
.toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px} .bar{height:12px;background:#eaf0f6;border-radius:999px;overflow:hidden;margin-bottom:18px} .bar>div{height:100%;background:linear-gradient(90deg,var(--accent2),#30d8ff,var(--accent3));transition:width .2s ease}
.question{font-size:clamp(22px,3.5vw,30px);font-weight:950;line-height:1.35;margin-top:6px} .answers{display:grid;grid-template-columns:1fr;gap:12px;margin-top:18px} @media(min-width:720px){.answers{grid-template-columns:1fr 1fr}}
.answer{width:100%;text-align:left;padding:16px;border:1px solid var(--border);background:#fff;border-radius:18px;font-size:17px;font-weight:850;cursor:pointer;min-height:68px;transition:transform .08s ease,box-shadow .08s ease} .answer:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(20,76,120,.08)}
.answer.correct{border-color:var(--good);background:#ebfbf2} .answer.wrong{border-color:var(--bad);background:#fff0f0} .feedback{min-height:58px;margin-top:15px;font-weight:900;line-height:1.55} .hidden{display:none!important}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px} .stat{background:#f8fbff;border:1px solid var(--border);border-radius:16px;padding:14px;text-align:center} .stat b{display:block;font-size:24px}
.resultImage{width:100%;max-width:380px;height:auto;object-fit:contain;border-radius:0;border:1px solid var(--border);box-shadow:var(--shadow);margin:14px auto 6px;display:block;background:#fff} .footer{font-size:12px;color:var(--muted);text-align:center;margin-top:10px} .small{font-size:13px}
table{width:100%;border-collapse:collapse;margin-top:12px} th,td{padding:10px;border-bottom:1px solid var(--border);text-align:left} th:last-child,td:last-child{text-align:right}

/* 補充提升展場手機體驗與 Google Sites 嵌入流暢度 */
html, body {
  min-height: 100%;
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  padding-top: 12px;
  padding-bottom: 24px;
}
.start-card {
  padding: 20px;
}
.start-grid {
  display: flex;
  flex-direction: column;
  gap: 16px;
  align-items: center;
}
.start-col-left {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.start-col-right {
  width: 100%;
}
@media (min-width: 600px) {
  .start-card {
    padding: 20px 24px;
  }
  .start-grid {
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }
  .start-col-left {
    flex: 1.1;
    max-width: 440px;
  }
  .start-col-right {
    flex: 1;
    max-width: 400px;
    text-align: left;
  }
  .start-col-right h1 {
    text-align: left;
    margin-top: 0;
    font-size: clamp(22px, 2.5vw, 30px);
  }
  .start-col-right p {
    text-align: left;
  }
}
@media (max-width: 599px) {
  .cover {
    max-height: 175px;
    object-fit: contain;
  }
  .start-card {
    padding: 16px 14px;
  }
}
#quiz {
  padding-top: 20px;
}
/* 為 Google Sites 頂部選單保留安全滾動邊距，徹底避免遮住倒數計時與分數 */
#topAnchor, #quiz, #quizAnchor, #start, #result, .toolbar {
  scroll-margin-top: 100px;
}
@media (max-width: 600px) {
  #quiz {
    padding-top: 20px;
  }
  #topAnchor, #quiz, #quizAnchor, #start, #result, .toolbar {
    scroll-margin-top: 85px;
  }
}
</style>
</head>

  function playWrongAnswerAudio(){
    if(!soundOn) return;
    try{
      wrongAnswerAudio.pause();
      wrongAnswerAudio.currentTime = 0;
      wrongAnswerAudio.play().catch(()=>{});
    }catch(e){}

  function sfx(kind){
    if(!soundOn) return;
    unlockAudio();
    if(kind==='start'){ mallet(523,0,.22,.16); mallet(659,.10,.22,.16); mallet(784,.20,.24,.22); clap(.28,.12); }
    if(kind==='ok'){ mallet(659,0,.25,.14); mallet(880,.08,.25,.16); mallet(1175,.16,.27,.22); clap(.18,.12); }
    if(kind==='bad'){ playWrongAnswerAudio(); }
    if(kind==='count'){ woodblock(0,.18); }
    if(kind==='panic'){ woodblock(0,.23); woodblock(.12,.21); }
    if(kind==='streak'){ mallet(784,0,.22,.12); mallet(988,.07,.23,.14); mallet(1318,.14,.25,.19); clap(.16,.10); }
    if(kind==='finish'){ mallet(523,0,.22,.14); mallet(659,.08,.22,.14); mallet(784,.16,.24,.16); mallet(1046,.24,.25,.18); mallet(1318,.34,.27,.25); clap(.36,.13); }
  }

  musicStep = 0;
  let nextNoteTime = 0;
  const stepDuration = 0.245;
  const scheduleAheadTime = 0.200;

  function scheduleMusicStep(step, time){
    const melody=[523,659,587,698,659,784,698,659,587,698,659,784,880,784,698,659];
    const bass=[131,147,165,147];
    const n = melody[step % melody.length];
    mallet(n, 0, .095, .13, time);
    if(step % 2 === 0) woodblock(.02, .07, time);
    if(step % 4 === 0) kick(.00, .065, time);
    if(step % 4 === 2) clap(.03, .045, time);
    if(step % 8 === 0) mallet(bass[Math.floor(step / 8) % bass.length], 0, .055, .16, time);
  }

  function musicScheduler(){
    if(!musicOn) return;
    const c = ctx();
    if(!c) return;
    if(c.state === 'suspended'){
      c.resume();
    }
    while(nextNoteTime < c.currentTime + scheduleAheadTime){
      scheduleMusicStep(musicStep, nextNoteTime);
      nextNoteTime += stepDuration;
      musicStep++;
    }
  }

  function startMusic(){
    stopMusic();
    if(!musicOn) return;
    unlockAudio();
    const c = ctx();
    if(!c) return;
    musicStep = 0;
    nextNoteTime = c.currentTime + 0.05;
    musicScheduler();
    musicTimer = setInterval(musicScheduler, 50);
  }

  function stopMusic(){
    if(musicTimer){
      clearInterval(musicTimer);
      musicTimer = null;
    }
  }
  function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } }
  function startTimer(){
    stopTimer(); timeLeft=15; $('#timeText').textContent=timeLeft;
    timer=setInterval(()=>{ timeLeft--; $('#timeText').textContent=Math.max(0,timeLeft);
      if(timeLeft<=5 && timeLeft>2) sfx('count');
      if(timeLeft<=2 && timeLeft>0) sfx('panic');
      if(timeLeft<=0){ stopTimer(); autoMiss(); }
    },1000);
  }

  function buildGame(){
    qs = shuffle(bank).slice(0,10).map(item => {
      const opts = item.a.map((txt,idx)=>({ txt, correct: idx===item.c }));
      const mixed = shuffle(opts);
      return { q:item.q, a:mixed.map(x=>x.txt), c:mixed.findIndex(x=>x.correct), tip:item.tip };
    });
    i=0; score=0; correct=0; streak=0; maxStreak=0; review=[];
  }

  function render(){
    clearNextTimer(); locked=false; $('#nextBtn').classList.add('hidden'); $('#feedback').textContent='';
    $('#qIndex').textContent=`第 ${i+1} / ${qs.length} 題`; $('#progress').style.width=`${((i+1)/qs.length)*100}%`;
    $('#scoreTop').textContent=score; $('#streakBadge').textContent=`🔥 連勝 ${streak}`; $('#question').textContent=qs[i].q;
    const box=$('#answers'); box.innerHTML='';
    qs[i].a.forEach((txt,n)=>{ const b=document.createElement('button'); b.className='answer'; b.type='button'; b.textContent=String.fromCharCode(65+n)+'. '+txt; b.addEventListener('click',()=>answer(n,b)); box.appendChild(b); });
    startTimer();
  }

  function clearNextTimer(){
    if(autoNextTimer){ clearTimeout(autoNextTimer); autoNextTimer=null; }
  }
  function gotoNext(){
    clearNextTimer();
    i++;
    if(i < qs.length) render();
    else finish();
  }

  function answer(choice,btn){
    if(locked)return; locked=true; stopTimer(); clearNextTimer();
    const q=qs[i], all=[...document.querySelectorAll('.answer')]; all.forEach(x=>x.disabled=true);
    const isCorrect = choice===q.c; review.push({q:q.q, chosen:q.a[choice], correct:q.a[q.c], ok:isCorrect, tip:q.tip});
    if(isCorrect){
      const chainBonus = Math.max(0, streak)*50; const speedBonus = timeLeft*25; const earned = 1000 + speedBonus + chainBonus;
      score += earned; correct++; streak++; maxStreak = Math.max(maxStreak, streak);
      btn.classList.add('correct');
      $('#feedback').textContent=`🎉 正確！ +${earned} 分（速度加成 +${speedBonus}，連勝加成 +${chainBonus}）`;
      sfx(streak>=3?'streak':'ok');
    }else{
      streak=0; btn.classList.add('wrong'); if(all[q.c]) all[q.c].classList.add('correct');
      $('#feedback').textContent='❌ 答錯了！ '+q.tip;
      sfx('bad');
    }
    $('#scoreTop').textContent=score; $('#streakBadge').textContent=`🔥 連勝 ${streak}`;
    
    // 點擊後直接自動切換下一題（答對 550ms，答錯 800ms 讓玩家看一眼正確答案）
    autoNextTimer = setTimeout(gotoNext, isCorrect ? 550 : 800);
  }

  function autoMiss(){
    if(locked)return; locked=true; streak=0; stopTimer(); clearNextTimer();
    const q=qs[i], all=[...document.querySelectorAll('.answer')]; all.forEach(x=>x.disabled=true); all[q.c].classList.add('correct');
    review.push({q:q.q, chosen:'未作答', correct:q.a[q.c], ok:false, tip:q.tip});
    $('#feedback').textContent='⏰ 時間到！ '+q.tip; $('#streakBadge').textContent=`🔥 連勝 ${streak}`; sfx('bad');
    autoNextTimer = setTimeout(gotoNext, 850);
  }

  function getResultTier(correctCount){
    if(correctCount <= 5) return {pct:30, title:'🧪 微蝕新鮮人', text:'剛經過微蝕洗禮，PCB魂正在萌芽！'};
    if(correctCount === 6) return {pct:50, title:'🫧 顯影潛力股', text:'PCB基因逐漸顯影，身上的電路越來越清晰！'};
    if(correctCount === 7) return {pct:70, title:'⚡ 鍍銅實力派', text:'實力持續鍍銅，腦中的知識線路全面導通！'};
    if(correctCount === 8) return {pct:80, title:'🛡️ 防焊高手', text:'全身自帶防焊保護，擋得住干擾，藏不住PCB魂！'};
    if(correctCount === 9) return {pct:90, title:'🔥 壓合老司機', text:'經過高溫高壓淬鍊，PCB知識早已與你壓合成一體！'};
    return {pct:100, title:'👑 銅箔究極體', text:'血液都是銅箔做的，心跳自帶電路，根本是人形PCB！'};
  }

  function saveScore(pct){
    if(isPracticeAttempt) return false;

    const key='pcb_ready_go_top10_v3';
    let board=[];
    try{ board=JSON.parse(localStorage.getItem(key)||'[]'); }catch(e){}

    const officialData={
      name:player,
      email:participantEmail,
      score,
      correct,
      pct,
      ts:Date.now()
    };

    board.push(officialData);
    board.sort((a,b)=>b.score-a.score||b.correct-a.correct||a.ts-b.ts);
    board=board.slice(0,10);

    try{
      localStorage.setItem(key, JSON.stringify(board));
      markOfficialScore(participantEmail, officialData);
    }catch(e){}

    return true;
  }

  function finish(){
    clearNextTimer(); stopTimer(); stopMusic(); $('#quiz').classList.add('hidden'); $('#result').classList.remove('hidden');
    notifyParentState('result', 880);
    scrollToTop('#result');
    const tier = getResultTier(correct);
    $('#resultName').textContent = `${player}，挑戰完成！` + (isPracticeAttempt ? '（練習模式）' : ''); 
    $('#correctNum').textContent=`${correct}/${qs.length}`; $('#finalScore').textContent=score; $('#bestStreak').textContent=maxStreak;
    $('#percentLine').textContent = `PCB人濃度 ${tier.pct}%`;
    $('#rank').textContent=tier.title; $('#resultText').textContent=tier.text;
    $('#resultImage').src = 'data:image/webp;base64,' + resultImages[String(tier.pct)];

    let officialNote = document.getElementById('officialScoreNote');
    if(!officialNote){
      officialNote = document.createElement('div');
      officialNote.id = 'officialScoreNote';
      officialNote.style.marginTop = '14px';
      officialNote.style.padding = '12px 14px';
      officialNote.style.borderRadius = '14px';
      officialNote.style.fontWeight = '900';
      officialNote.style.lineHeight = '1.5';
      const statsEl = document.querySelector('#result .stats');
      if(statsEl) statsEl.insertAdjacentElement('afterend', officialNote);
    }

    if (isPracticeAttempt) {
      officialNote.textContent = '🎮 本次為練習測驗，不列入正式排行榜與重複發送信件。';
      officialNote.style.background = '#fff8e8';
      officialNote.style.border = '1px solid #e7b548';
      officialNote.style.color = '#8a5a00';

      // 練習成績寫入雲端紀錄為「練習」，不覆蓋正式紀錄與排行榜
      uploadScoreToCloud({
        email: participantEmail,
        player: player,
        score: score,
        correct: correct,
        pct: tier.pct,
        rankTitle: tier.title,
        maxStreak: maxStreak,
        isPractice: true
      }, () => {});
    } else {
      // 儲存本地
      const localOfficialSaved = saveScore(tier.pct);

      officialNote.textContent = '⏳ 正在同步成績至雲端試算表...';
      officialNote.style.background = '#f4fbff';
      officialNote.style.border = '1px solid #15a7ff';
      officialNote.style.color = '#17324b';

      // 雲端同步回寫 Google Sheet
      uploadScoreToCloud({
        email: participantEmail,
        player: player,
        score: score,
        correct: correct,
        pct: tier.pct,
        rankTitle: tier.title,
        maxStreak: maxStreak,
        isPractice: false
      }, (cloudRes) => {
        const isOfficial = cloudRes ? cloudRes.isOfficial : localOfficialSaved;
        if (isOfficial) {
          officialNote.textContent = '✅ 本次已登記為您的唯一正式成績，並納入正式排行榜！認證信件已寄至您的信箱。';
          officialNote.style.background = '#ebfbf2';
          officialNote.style.border = '1px solid #1ab86a';
          officialNote.style.color = '#117844';
        } else {
          officialNote.textContent = '🎮 此 E-mail 已有正式成績，本次為練習成績，不重複列入正式排行榜。';
          officialNote.style.background = '#fff8e8';
          officialNote.style.border = '1px solid #e7b548';
          officialNote.style.color = '#8a5a00';
        }
      });
    }

    sfx('finish');
  }

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  
  function renderLeaderboard(){
    const box = $('#leaderboard');
    if(!box.classList.contains('hidden')){
      box.classList.add('hidden');
      return;
    }
    box.innerHTML = '<h3>🏆 排行榜 TOP 10</h3><p class="muted">讀取中...</p>';
    box.classList.remove('hidden');
    setTimeout(() => {
      try { box.scrollIntoView({ block: 'start', behavior: 'smooth' }); } catch(e){}
    }, 50);

    fetchLeaderboard(cloudList => {
      let board = cloudList;
      let isCloud = true;
      if (!board || !board.length) {
        isCloud = false;
        const key='pcb_ready_go_top10_v3';
        try{ board=JSON.parse(localStorage.getItem(key)||'[]'); }catch(e){ board=[]; }
      }

      if(!board || !board.length){
        box.innerHTML='<h3>🏆 ' + (isCloud ? '雲端' : '本機') + '排行榜 TOP 10</h3><p class="muted">目前尚未有紀錄。</p>';
      } else {
        box.innerHTML='<h3>🏆 ' + (isCloud ? '雲端' : '本機') + '排行榜 TOP 10</h3>' +
          '<table><thead><tr><th>名次</th><th>暱稱</th><th>答對</th><th>濃度</th><th>分數</th></tr></thead><tbody>' +
          board.map((x,idx)=>`<tr><td>#${idx+1}</td><td>${escapeHtml(x.name)}</td><td>${x.correct}/10</td><td>${x.pct}%</td><td><b>${x.score}</b></td></tr>`).join('') +
          '</tbody></table>' +
          '<p class="muted small">' + (isCloud ? '☁️ 成績即時同步自 Google 試算表（僅顯示唯一正式成績，保護個人隱私）。' : '此排行榜只儲存在目前這台裝置。') + '</p>';
      }
    });
  }

  function renderReview(){
    const box=$('#reviewPanel');
    box.innerHTML='<h3>📘 本次作答回顧</h3>' + review.map((x,idx)=>`<div style="padding:12px 0;border-bottom:1px solid #eef2f6"><div><b>第 ${idx+1} 題：${escapeHtml(x.q)}</b></div><div style="margin-top:6px;color:${x.ok?'#1ab86a':'#f45b5b'};font-weight:900">${x.ok?'✔ 答對':'✖ 答錯'}（你的選擇：${escapeHtml(x.chosen)}）</div><div style="margin-top:4px;color:#17324b">正確解答：<b>${escapeHtml(x.correct)}</b></div><div class="muted small" style="margin-top:4px">${escapeHtml(x.tip)}</div></div>`).join('');
    box.classList.toggle('hidden');
    if(!box.classList.contains('hidden')){
      setTimeout(() => {
        try { box.scrollIntoView({ block: 'start', behavior: 'smooth' }); } catch(e){}
      }, 50);
    }
  }

  function normalizeEmail(v){
    return String(v || '').trim().toLowerCase();
  }

  function officialScoreKey(email){
    return 'pcb_ready_go_official_' + normalizeEmail(email);
  }

  function hasOfficialScore(email){
    try{
      return !!localStorage.getItem(officialScoreKey(email));
    }catch(e){
      return false;
    }
  }

  function markOfficialScore(email, data){
    try{
      localStorage.setItem(officialScoreKey(email), JSON.stringify(data));
    }catch(e){}
  }

  function notifyParentState(state, height){
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'pcb_resize', state: state, height: height }, '*');
        window.parent.postMessage({ type: 'pcb_scroll_top' }, '*');
      }
    } catch(e){}
  }

  function scrollToTop(targetSelector, blockMode){
    const doScroll = () => {
      try { window.scrollTo({ top: 0, left: 0, behavior: 'instant' }); } catch(e) {
        try { window.scrollTo(0, 0); } catch(e2) {}
      }
      try { if (document.body) document.body.scrollTop = 0; } catch(e) {}
      try { if (document.documentElement) document.documentElement.scrollTop = 0; } catch(e) {}
      try {
        const target = targetSelector ? document.querySelector(targetSelector) : null;
        if (target) {
          if (target.focus) target.focus({ preventScroll: true });
          if (target.scrollIntoView) {
            target.scrollIntoView({ block: 'start', inline: 'nearest', behavior: 'instant' });
          }
        } else {
          const topEl = document.getElementById('topAnchor');
          if (topEl && topEl.scrollIntoView) {
            topEl.scrollIntoView({ block: 'start', behavior: 'instant' });
          }
        }
      } catch(e) {}
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'pcb_scroll_top' }, '*');
        }
      } catch(e) {}
    };

    doScroll();
    requestAnimationFrame(doScroll);
    setTimeout(doScroll, 30);
    setTimeout(doScroll, 100);
    setTimeout(doScroll, 250);
    setTimeout(doScroll, 500);
  }

  function validEmail(v){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  }

  // 監聽 Email 輸入框失焦自動檢查雲端正式成績狀態
  $('#email').addEventListener('input', () => {
    $('#practiceBtn').classList.add('hidden');
    $('#startBtn').classList.remove('hidden');
    $('#startBtn').disabled = false;
    $('#nameMsg').textContent = '成績將自動同步至雲端試算表。';
    $('#nameMsg').style.color = 'var(--muted)';
    $('#nameMsg').style.fontWeight = 'normal';
  });

  $('#email').addEventListener('blur', () => {
    const emailVal = $('#email').value.trim();
    if (emailVal && validEmail(emailVal)) {
      $('#nameMsg').textContent = '🔍 正在驗證 E-mail 認證資格...';
      $('#nameMsg').style.color = '#15a7ff';
      checkCloudEmail(emailVal, (has) => {
        if (has) {
          $('#nameMsg').textContent = '🎉 您已是被認證過的 PCB 人囉！每位挑戰者僅限認證一次。';
          $('#nameMsg').style.color = '#ff3a8a';
          $('#nameMsg').style.fontWeight = '900';
          $('#startBtn').classList.add('hidden');
          $('#practiceBtn').classList.remove('hidden');
        } else {
          $('#nameMsg').textContent = '✨ 認證資格確認有效，歡迎參加挑戰！';
          $('#nameMsg').style.color = '#1ab86a';
          $('#nameMsg').style.fontWeight = 'normal';
          $('#startBtn').classList.remove('hidden');
          $('#startBtn').disabled = false;
          $('#practiceBtn').classList.add('hidden');
        }
      });
    }
  });

  $('#soundBtn').addEventListener('click',()=>{ unlockAudio(); soundOn=!soundOn; $('#soundBtn').textContent = soundOn ? '🔊 音效：開' : '🔇 音效：關'; });
  $('#musicBtn').addEventListener('click',()=>{ unlockAudio(); musicOn=!musicOn; $('#musicBtn').textContent = musicOn ? '🎵 答題節奏：開' : '🎵 答題節奏：關'; if(!$('#quiz').classList.contains('hidden') && musicOn) startMusic(); else stopMusic(); });
  
  $('#startBtn').addEventListener('click',()=>{
    unlockAudio();
    const emailVal=$('#email').value.trim();
    const nickVal=$('#nickname').value.trim();
    const consent=$('#consent').checked;

    if(!emailVal || !validEmail(emailVal)){
      $('#nameMsg').textContent='請輸入有效的 E-mail。';
      $('#nameMsg').style.color='#f45b5b';
      $('#nameMsg').style.fontWeight='normal';
      $('#email').focus();
      return;
    }
    if(!nickVal){
      $('#nameMsg').textContent='請輸入暱稱後再開始挑戰。';
      $('#nameMsg').style.color='#f45b5b';
      $('#nameMsg').style.fontWeight='normal';
      $('#nickname').focus();
      return;
    }
    if(!consent){
      $('#nameMsg').textContent='請勾選同意資料蒐集後再開始挑戰。';
      $('#nameMsg').style.color='#f45b5b';
      $('#nameMsg').style.fontWeight='normal';
      $('#consent').focus();
      return;
    }

    participantEmail=normalizeEmail(emailVal);
    player=nickVal.slice(0,12);

    $('#startBtn').disabled = true;
    $('#nameMsg').textContent = '🔍 正在驗證 E-mail 認證資格...';
    $('#nameMsg').style.color = '#15a7ff';
    $('#nameMsg').style.fontWeight = 'normal';

    // 嚴格檢查是否已認證過
    checkCloudEmail(participantEmail, (has) => {
      if (has) {
        $('#nameMsg').textContent = '🎉 您已是被認證過的 PCB 人囉！每位挑戰者僅限認證一次。';
        $('#nameMsg').style.color = '#ff3a8a';
        $('#nameMsg').style.fontWeight = '900';
        $('#startBtn').classList.add('hidden');
        $('#practiceBtn').classList.remove('hidden');
        return; // 嚴格阻擋！不進入正式測驗！
      }

      try { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); } catch(e) {}
      isPracticeAttempt = false;
      $('#startBtn').disabled = false;
      unlockAudio();
      sfx('start');
      buildGame();
      $('#playerBadge').textContent='👤 '+player;
      $('#start').classList.add('hidden');
      $('#result').classList.add('hidden');
      $('#quiz').classList.remove('hidden');
      notifyParentState('quiz', 620);
      scrollToTop('#quizAnchor');
      startMusic();
      render();
    });
  });

  // 練習測驗按鈕點擊處理
  $('#practiceBtn').addEventListener('click', () => {
    unlockAudio();
    const emailVal=$('#email').value.trim();
    const nickVal=$('#nickname').value.trim();
    const consent=$('#consent').checked;

    if(!emailVal || !validEmail(emailVal)){
      $('#nameMsg').textContent='請輸入有效的 E-mail。';
      $('#nameMsg').style.color='#f45b5b';
      $('#nameMsg').style.fontWeight='normal';
      $('#email').focus();
      return;
    }
    if(!nickVal){
      $('#nameMsg').textContent='請輸入暱稱後再開始練習。';
      $('#nameMsg').style.color='#f45b5b';
      $('#nameMsg').style.fontWeight='normal';
      $('#nickname').focus();
      return;
    }
    if(!consent){
      $('#nameMsg').textContent='請勾選同意資料蒐集後再開始練習。';
      $('#nameMsg').style.color='#f45b5b';
      $('#nameMsg').style.fontWeight='normal';
      $('#consent').focus();
      return;
    }

    try { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); } catch(e) {}
    participantEmail = normalizeEmail(emailVal);
    player = nickVal.slice(0,12);
    isPracticeAttempt = true;

    unlockAudio();
    sfx('start');
    buildGame();
    $('#playerBadge').textContent = '👤 ' + player + ' (練習)';
    $('#start').classList.add('hidden');
    $('#result').classList.add('hidden');
    $('#quiz').classList.remove('hidden');
    notifyParentState('quiz', 620);
    scrollToTop('#quizAnchor');
    startMusic();
    render();
  });

  $('#nextBtn').addEventListener('click', gotoNext);
  $('#restartBtn').addEventListener('click',()=>{
    isPracticeAttempt = false;
    $('#email').value = '';
    $('#nickname').value = '';
    $('#consent').checked = false;
    $('#practiceBtn').classList.add('hidden');
    $('#startBtn').classList.remove('hidden');
    $('#startBtn').disabled = false;
    $('#nameMsg').textContent = '成績將自動同步至雲端試算表。';
    $('#nameMsg').style.color = 'var(--muted)';
    $('#nameMsg').style.fontWeight = 'normal';
    $('#leaderboard').classList.add('hidden');
    $('#reviewPanel').classList.add('hidden');
    $('#result').classList.add('hidden');
    $('#start').classList.remove('hidden');
    notifyParentState('start', 580);
    scrollToTop('#topAnchor', 'start');
  });
  $('#leaderBtn').addEventListener('click', () => {
    notifyParentState('expand', 1180);
    renderLeaderboard();
  });
  $('#reviewBtn').addEventListener('click', () => {
    notifyParentState('expand', 1180);
    renderReview();
  });

  notifyParentState('start', 580);
})();
</script>
